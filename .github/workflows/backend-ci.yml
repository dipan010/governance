name: backend-ci

on:
  push:
    branches: ["main", "claude/**"]
    paths: ["backend/**", "data/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "data/**", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Typecheck (mypy strict)
        run: mypy app tests

      - name: Tests
        run: pytest -q

      - name: Migrations are reversible
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
        env:
          PCDA_DATABASE_URL: sqlite+pysqlite:///./ci.db
